name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shot, physics or settling
        - Camera or input
        - Rules or scoring
        - UI
        - Android build
        - Web build
        - CI / tooling / docs
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead? Include exact steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device or OS, browser and version, build version, and where the build came from.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or a short screen recording
      description: For input or camera bugs, say which view and which gesture.
